# Tyrian purpledoc config
kind: tyrian
inputs:
  staticSite: website
outputs:
  destination: docs
website:
  title: Tyrian
  description: Elm-inspired Scala UI library.
  topNavLogo:
    image: tyrian-horizontal.svg
    width: 150.0
    height: 50.0
  logo:
    image: tyrian.svg
  latestRelease: 0.30.0-M2-PREVIEW
  baseUrl: https://purplekingdomgames.github.io/tyrian-docs/
  # baseUrl: http://127.0.0.1:8080/
  navigationOrder:
    - documentation
    - examples
    - examples-classic
  navigationMappings:
    documentation: Documentation
    examples: Tyrian Examples
    examples-classic: Classic Tyrian Examples
docsRepo:
  name: Docs
  url: https://github.com/PurpleKingdomGames/tyrian-docs
  editBaseUrl: https://github.com/PurpleKingdomGames/tyrian-docs/blob/main
repo:
  name: Github
  url: https://github.com/PurpleKingdomGames/indigoengine
  editBaseUrl: https://github.com/PurpleKingdomGames/indigoengine/blob/main
discord:
  name: Discord
  url: https://discord.gg/3E2r9FwwHu
demo:
  width: 400
  height: 400
